---
layout: default
---
<article class="essay">
  <header class="essay__header">
    <div class="essay__meta">
      {% if page.pillar %}<span class="pillar-label">{{ page.pillar }}</span>{% endif %}
      <time class="mono" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </div>
    <h1 class="essay__title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="essay__subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
