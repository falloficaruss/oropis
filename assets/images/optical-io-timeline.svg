<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="timelineTitle timelineDesc">
  <title id="timelineTitle">Optical I/O: demoed, shipped, promised, 2025-2028</title>
  <desc id="timelineDesc">Four-lane timeline of Ayar Labs, Lightmatter, Marvell and Celestial AI, and Nvidia optical I/O events from Q3 2025 through Q4 2028, with marker types for confirmed, demo-only, and promised items, plus a falsification test window.</desc>
  <style>
    svg {
      --text: #1f1f1d;
      --muted: #555550;
      --neutral: #888780;
      --marker-bg: #ffffff;
      --band: rgba(136, 135, 128, 0.08);
      --leader: rgba(85, 85, 80, 0.62);
      --ayar: #1D9E75;
      --lightmatter: #7F77DD;
      --marvell: #378ADD;
      --nvidia: #888780;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --text: #f4f4ef;
        --muted: #cfcfc7;
        --neutral: #c7c7be;
        --marker-bg: #1e1e1e;
        --band: rgba(255, 255, 255, 0.07);
        --leader: rgba(244, 244, 239, 0.55);
      }
    }
    .title { fill: var(--text); font-size: 24px; font-weight: 700; }
    .legend-label { fill: var(--text); font-size: 13px; }
    .lane-label { fill: var(--text); font-size: 14px; font-weight: 700; }
    .year-label { fill: var(--text); font-size: 14px; font-weight: 700; }
    .quarter-label { fill: var(--muted); font-size: 13px; }
    .event-label { fill: var(--text); font-size: 13px; }
    .overlay-label { fill: var(--text); font-size: 13px; font-weight: 600; }
    .band-label { fill: var(--muted); font-size: 13px; font-weight: 600; }
    .leader { fill: none; stroke: var(--leader); stroke-width: 1; stroke-linecap: round; }
    .axis { stroke: var(--neutral); stroke-width: 1.2; }
    .tick { stroke: var(--neutral); stroke-width: 1; }
    .lane { fill: none; stroke-width: 2; }
  </style>

  <rect x="591.5" y="138" width="267.1" height="494" fill="var(--band)"/>

  <text class="title" x="30" y="32">Optical I/O: demoed, shipped, promised, 2025-2028</text>

