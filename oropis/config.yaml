account: oropis
db: data.db

network:
  user_agent: "agg/0.1 (Oropis robotics and AI desk; +https://oropis.com)"
  timeout_s: 25
  max_concurrent: 8
  retries: 2
  reddit_delay_s: 10.0

poll:
  default_interval_s: 900
  catchup_hours: 72
  digest_cap: 45
  jitter_s: 20
  max_items_per_source: 60

scoring:
  recency_half_life_h: 8.0
  watchlist_boost: 0.20
  single_source_penalty: 0.12

relevance:
  require_any:
    - artificial intelligence
    - AI
    - machine learning
    - deep learning
    - neural network
    - neural networks
    - large language model
    - large language models
    - LLM
    - LLMs
    - foundation model
    - frontier model
    - generative AI
    - agentic
    - AI agent
    - AI agents
    - multimodal
    - reasoning model
    - robot
    - robots
    - robotic
    - robotics
    - humanoid
    - humanoids
    - cobot
    - cobots
    - autonomous
    - autonomy
    - self-driving
    - driverless
    - drone
    - drones
    - UAV
    - AMR
    - AGV
    - manipulator
    - quadruped
    - exoskeleton
    - embodied AI
    - robotaxi
    - machine vision
  exclude_any:
    - esports
    - e-sports
    - PUBG Mobile
    - Free Fire
    - "Call of Duty: Mobile"
  context_any: []

telegram:
  enabled: true
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  min_score: 0.60
  official_min_score: 0.48
  max_per_hour: 10
  max_per_day: 60
  max_age_h: 12.0
  backfill_minutes: 30
  poll_interval_s: 10
  max_attempts: 3
  disable_preview: true
  instant_sources:
    - ai_openai
    - ai_deepmind
    - ai_google
    - ai_meta_engineering
    - ai_microsoft
    - ai_nvidia
    - ai_huggingface
    - ai_apple_ml
    - ai_google_research
    - ai_nature_machine_intelligence
    - robotics_nvidia
    - robotics_waymo
    - robotics_ieee_spectrum
    - robotics_the_robot_report
    - robotics_cmu_ri
    - robotics_science_robotics
  discovery_only_sources:
    - ai_arxiv_cs_ai
    - ai_arxiv_cs_lg
    - ai_arxiv_cs_cl
    - ai_arxiv_stat_ml
    - robotics_arxiv_cs_ro
    - google_news_ai
    - google_news_robotics
    - google_news_ai_funding
    - google_news_robotics_funding

site:
  enabled: true
  name: Oropis
  tagline: "Robotics & AI, reported."
  description: "Independent coverage of artificial intelligence and robotics: frontier models, research, humanoids, autonomy, policy, and the business of the machine economy."
  base_url: https://oropis.com
  email: editorial@oropis.com
  x_handle: "@OropisHQ"
  db: site.db
  media_dir: site-media
  repo_path: site-repo
  repo_url: git@github.com:falloficaruss/oropis.git
  branch: master
  host: 127.0.0.1
  port: 8091
  page_size: 20
  min_draft_score: 0.48
  default_author: OropisHQ
  auto_deploy: true
  deploy_limit: 6
  cache_heroes: true
  plan_days: 7
  plan_targets:
    research: [5, 8]
    product: [3, 6]
    deployment: [2, 4]
    funding: [2, 4]
    policy: [1, 2]
    business: [1, 2]
    news: [3, 5]

