# Discovery queries — enrich the queue, never trigger a push on their own
# ============================================================================
  - name: google_news_ai
    kind: google_news
    authority: 0.60
    tier: 4
    interval_s: 900
    skip_relevance: true
    options:
      query: '("artificial intelligence" OR "AI model" OR LLM OR "generative AI" OR "AI regulation")'
