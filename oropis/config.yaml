voice:
  tone: "Clear, precise technology-desk voice. Lead with the capability, result, or deployment that matters. Explain what changed and why. No hype, no breathless AGI claims."
  max_chars: 280
  banned: ["BREAKING", "🚨", "insane", "you won't believe", "game-changer", "revolutionary", "sentient"]
  attribution: true
