{% extends "base.html" %}
{% block title %}New article{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>New article</h1>
    <p class="muted">Start a draft of your own. You can edit everything after creating it.</p>
  </div>
</div>

<form method="post" action="/admin/new" class="panel stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Headline
    <input name="headline" required autofocus>
  </label>
  <label>Dek / summary
    <textarea name="dek" rows="3"></textarea>
  </label>
  <div class="grid three">
    <label>Beat
      <input name="beat" placeholder="AI or Robotics">
    </label>
    <label>Archetype
      <select name="archetype">
        {% for a in ['research', 'product', 'deployment', 'funding', 'policy', 'business', 'news'] %}
        <option value="{{ a }}" {% if a == 'news' %}selected{% endif %}>{{ a }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Format
      <select name="format">
        {% for f in ['news', 'launch', 'research', 'analysis', 'feature', 'policy', 'funding', 'deployment'] %}
        <option value="{{ f }}" {% if f == 'news' %}selected{% endif %}>{{ f }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label>Author
    <input name="author" value="{{ default_author }}">
  </label>
  <label>Body (Markdown)
    <textarea name="body_md" rows="14" placeholder="Write the story…"></textarea>
  </label>
  <div class="actions">
    <button class="primary" type="submit">Create draft</button>
    <a class="button ghost" href="/admin/queue">Cancel</a>
  </div>
</form>
{% endblock %}
