<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Admin{% endblock %} — {{ site.name }}</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin">{{ site.name }} <span>desk</span></a>
    {% if user %}
    <nav>
      <a href="/admin">Home</a>
      <a href="/admin/queue">Queue</a>
      <a href="/admin/coverage">Coverage</a>
      <a href="/admin/deploy">Deploy</a>
    </nav>
    <form method="post" action="/admin/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="linkish" type="submit">Sign out</button>
    </form>
    {% endif %}
  </header>

  <main class="wrap">
    {% if msg %}
    <div class="flash {{ kind }}">{{ msg }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <span>{{ site.base_url }}</span>
    <span>Local admin · {{ site.host }}:{{ site.port }}</span>
  </footer>
</body>
</html>
